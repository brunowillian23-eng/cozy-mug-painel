<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Mug · Painel</title>
<meta name="theme-color" content="#32785c">
<script>
/* tema, densidade e escala de fonte aplicados ANTES da primeira pintura (sem "flash") */
(function(){try{
  var d=document.documentElement,g=function(k){return localStorage.getItem('cozymug.'+k)};
  var t=g('theme'); if(t==='light'||t==='dark') d.dataset.theme=t;
  if(g('density')==='compact') d.dataset.density='compact';
  var f=g('fs'); if(f==='sm'||f==='lg') d.dataset.fs=f;
}catch(e){}})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="progress" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <button class="logo pressable" id="logo" type="button" aria-label="Cozy Mug — ir para o Painel">
    <img src="logo-icon.png" width="40" height="40" alt="" decoding="async">
    <span>Cozy Mug</span>
  </button>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções do painel"></nav>
  <div class="actions">
    <button class="badge rip pressable" id="syncBadge" type="button" data-act="tab" data-tab="ajustes"><span class="dot" aria-hidden="true"></span><span class="lbl">Só neste aparelho</span></button>
    <button class="icon-btn rip pressable" id="exportBtn" type="button" data-act="exportxlsx" title="Baixar tudo em uma planilha (.xlsx)" aria-label="Exportar para planilha"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span class="lbl">Planilha</span></button>
    <button class="icon-btn rip pressable" id="themeBtn" type="button" data-act="theme"></button>
  </div>
</header>

<section class="hero" aria-live="polite">
  <i class="c1"></i><i class="c2"></i><i class="c3"></i>
  <div class="hero-in"><h1 id="heroTitle"></h1><p id="heroSub"></p></div>
</section>

<div class="page">
  <div class="filters" id="filters" hidden></div>
  <main id="view"></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Janela"><div class="sheet" id="sheet" tabindex="-1"></div></div>

<script src="core.js"></script>
<script src="fx.js"></script>
<script src="xlsx.js"></script>
<script src="charts.js"></script>
<script src="ui.js"></script>
</body>
</html>

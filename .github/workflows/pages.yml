name: Publicar painel (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir sintaxe do JavaScript
        run: node --check site/app.js
      - name: Garantir que nenhum dado financeiro foi commitado aqui
        run: |
          if git ls-files | grep -E '(^|/)data\.json$'; then
            echo "::error::data.json não deve ficar neste repositório (ele é público). Use o repositório PRIVADO de dados."
            exit 1
          fi

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
